name: System CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  LLVM_SYS_180_PREFIX: /usr/lib/llvm-18

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout genesis-kernel
        uses: actions/checkout@v4
        with:
          path: genesis-kernel

      - name: Checkout genesis-lang
        uses: actions/checkout@v4
        with:
          repository: unbiasedcodex/genesis-lang
          path: genesis-lang

      - name: Checkout genesis-runtime
        uses: actions/checkout@v4
        with:
          repository: unbiasedcodex/genesis-runtime
          path: genesis-runtime

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev libpolly-18-dev clang-18 libzstd-dev zlib1g-dev \
            nasm grub-pc-bin xorriso mtools qemu-system-x86 socat imagemagick

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            genesis-lang/target
          key: cargo-kernel-${{ runner.os }}-${{ hashFiles('genesis-lang/Cargo.lock') }}

      - name: Build glc
        run: |
          mkdir -p /tmp/ci-logs
          cargo build --release --manifest-path genesis-lang/Cargo.toml 2>&1 | tee /tmp/ci-logs/glc-build.log

      - name: Build runtime services
        run: |
          make -C genesis-runtime all install 2>&1 | tee /tmp/ci-logs/runtime-build.log

      - name: Build kernel ISO
        run: |
          make -C genesis-kernel iso GLC="$GITHUB_WORKSPACE/genesis-lang/target/release/glc" 2>&1 | tee /tmp/ci-logs/kernel-build.log

      - name: Boot in QEMU (serial capture, keystrokes, screenshots)
        run: |
          cd genesis-kernel
          qemu-system-x86_64 -cdrom genesis.iso -m 128M -no-reboot \
            -serial file:/tmp/ci-logs/serial.log \
            -display none \
            -monitor unix:/tmp/mon.sock,server,nowait &
          QEMU_PID=$!
          mon() { echo "$1" | socat - UNIX-CONNECT:/tmp/mon.sock > /dev/null 2>&1 || true; }
          # Wait for kernel startup tests and userspace services to settle
          sleep 55
          mon "screendump /tmp/ci-logs/screen-boot.ppm"
          sleep 1
          # Type "geb" + Enter into the shell (PS/2 keyboard via monitor)
          for k in g e b ret; do mon "sendkey $k"; sleep 1; done
          sleep 10
          mon "screendump /tmp/ci-logs/screen-geb.ppm"
          sleep 1
          mon "quit"
          sleep 2
          kill $QEMU_PID 2>/dev/null || true
          for f in /tmp/ci-logs/screen-boot /tmp/ci-logs/screen-geb; do
            [ -f "$f.ppm" ] && convert "$f.ppm" "$f.png" && rm "$f.ppm"
          done
          echo "=== serial.log (first 200 lines) ==="
          head -200 /tmp/ci-logs/serial.log
          ls -la /tmp/ci-logs/

      - name: Check boot markers
        run: |
          for marker in BOOT KERNEL "MM OK"; do
            if grep -q "$marker" /tmp/ci-logs/serial.log; then
              echo "FOUND: $marker"
            else
              echo "MISSING: $marker"
            fi
          done
          grep -q "KERNEL" /tmp/ci-logs/serial.log

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          cd /tmp/ci-logs
          git init -b ci-logs
          git config user.name "ci"
          git config user.email "ci@localhost"
          git add -A
          git commit -m "CI logs for run ${{ github.run_id }} (${{ github.sha }})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
