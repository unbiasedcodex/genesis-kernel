name: System CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  LLVM_SYS_180_PREFIX: /usr/lib/llvm-18

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout genesis-kernel
        uses: actions/checkout@v4
        with:
          path: genesis-kernel

      - name: Checkout genesis-lang
        uses: actions/checkout@v4
        with:
          repository: unbiasedcodex/genesis-lang
          path: genesis-lang

      - name: Checkout genesis-runtime
        uses: actions/checkout@v4
        with:
          repository: unbiasedcodex/genesis-runtime
          path: genesis-runtime

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev libpolly-18-dev clang-18 libzstd-dev zlib1g-dev \
            nasm grub-pc-bin xorriso mtools qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            genesis-lang/target
          key: cargo-kernel-${{ runner.os }}-${{ hashFiles('genesis-lang/Cargo.lock') }}

      - name: Build glc
        run: |
          mkdir -p /tmp/ci-logs
          cargo build --release --manifest-path genesis-lang/Cargo.toml 2>&1 | tee /tmp/ci-logs/glc-build.log

      - name: Build runtime services
        run: |
          make -C genesis-runtime all install 2>&1 | tee /tmp/ci-logs/runtime-build.log

      - name: Build kernel ISO
        run: |
          make -C genesis-kernel iso GLC="$GITHUB_WORKSPACE/genesis-lang/target/release/glc" 2>&1 | tee /tmp/ci-logs/kernel-build.log

      - name: Boot in QEMU (45s, serial capture)
        run: |
          cd genesis-kernel
          timeout 45 qemu-system-x86_64 -cdrom genesis.iso -serial stdio -display none -m 128M -no-reboot \
            > /tmp/ci-logs/serial.log 2>&1 || true
          echo "=== serial.log (first 200 lines) ==="
          head -200 /tmp/ci-logs/serial.log

      - name: Check boot markers
        run: |
          for marker in BOOT KERNEL "MM OK"; do
            if grep -q "$marker" /tmp/ci-logs/serial.log; then
              echo "FOUND: $marker"
            else
              echo "MISSING: $marker"
            fi
          done
          grep -q "KERNEL" /tmp/ci-logs/serial.log

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          cd /tmp/ci-logs
          git init -b ci-logs
          git config user.name "ci"
          git config user.email "ci@localhost"
          git add -A
          git commit -m "CI logs for run ${{ github.run_id }} (${{ github.sha }})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
